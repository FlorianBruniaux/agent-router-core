[workspace]
members = ["crates/adapter-claude", "crates/adapter-codex", "crates/adapter-copilot", "crates/adapter-opencode", "crates/agent-router-cli", "crates/router-adapter-api", "crates/router-advisory-cache", "crates/router-asset-contracts", "crates/router-backend-policy", "crates/router-backend-store", "crates/router-catalog", "crates/router-catalog-store", "crates/router-coordinator", "crates/router-decision", "crates/router-doctor", "crates/router-eval", "crates/router-execution-decision", "crates/router-feedback", "crates/router-import", "crates/router-local-api", "crates/router-policy", "crates/router-prepare", "crates/router-retrieval", "crates/router-runtime", "crates/router-sandbox-helper", "crates/router-types", "crates/router-validation", "crates/router-workflow"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "FSL-1.1-ALv2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
